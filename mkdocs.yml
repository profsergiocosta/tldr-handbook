site_name: The tlDR Engine Handbook
site_description: >
  A practical guide to building a DELTARUNE-style game with the tlDR Engine:
  the overworld, the battle system, and a field reference.
site_author: "Sergio Souza Costa"

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - attr_list
  - admonition
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/lambdageo.css

nav:
  - "⇦ Coleção LambdaGeo": https://lambdageo.github.io/ebooks/
  - Introduction: index.md

  - Part 1 — Getting Started:
    - "Ch 1: Installation":              getting-started/installation.md
    - "Ch 2: Fonts and Accents":         getting-started/fonts-and-accents.md

  - Part 2 — The Overworld:
    - "Ch 3: Rooms and Collision":       overworld/rooms-and-collision.md
    - "Ch 4: NPCs and Dialogue":         overworld/npcs-and-dialogue.md
    - "Ch 5: Tiles and Tilesets":        overworld/tiles-and-tilesets.md
    - "Ch 6: Your First Room":           overworld/your-first-room.md
    - "Ch 7: Cutscenes and Camera":      overworld/cutscenes.md
    - "Ch 8: Climbing and Traversal":    overworld/climbing.md
    - "Ch 9: Hazards and Dodging":       overworld/hazards-and-chases.md
    - "Ch 10: Shortcuts and Mechanisms": overworld/shortcuts-and-triggers.md
    - "Ch 11: Lighting and Atmosphere":  overworld/lighting-and-atmosphere.md

  - Part 3 — The Battle System:
    - "Ch 12: How a Fight Works":        battle-system/overview.md
    - "Ch 13: Your First Enemy":         battle-system/your-first-enemy.md
    - "Ch 14: The Arena":                battle-system/the-arena.md
    - "Ch 15: Advanced Patterns":        battle-system/advanced-patterns.md

  - Part 4 — Systems and Economy:
    - "Ch 16: Items and Equipment":      systems/items-and-equipment.md
    - "Ch 17: Shops and Vendors":        systems/shops-and-vendors.md
    - "Ch 18: Party and the Light World": systems/party-and-light-world.md

  - Reference:
    - "enemy()":                         reference/enemy-struct.md
    - "enc_set()":                       reference/enc-set.md
    - "turn_object":                     reference/turn-object.md
    - "item()":                          reference/item-struct.md
    - "shop()":                          reference/shop-struct.md
