name: Publish Book (GitHub Pages via gh-pages)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Needed to create and update the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # keeps revision history available to Git-based plugins

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build only (validation)
        # On pull requests, just check that the site compiles
        if: github.event_name == 'pull_request'
        run: mkdocs build

      - name: Build and deploy to gh-pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force
